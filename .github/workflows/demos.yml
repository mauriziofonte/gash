name: Demos

# Records the README GIFs from docs/tapes/*.tape with vhs, against gash
# built from the commit (docs/tapes/render.sh). On main it commits the GIFs
# that changed; on a pull request it only records them and uploads them as
# an artifact, so a tape that breaks shows up before the merge.

on:
  push:
    branches: [main]
    paths:
      - "docs/tapes/**"
      - ".github/workflows/demos.yml"
      - "VERSION"
  pull_request:
    paths:
      - "docs/tapes/**"
      - ".github/workflows/demos.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demos-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.3"

jobs:
  render:
    name: Render GIFs
    runs-on: ubuntu-24.04
    steps:
      # The job commits the re-recorded GIFs, so it keeps the credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 # zizmor: ignore[artipacked]

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      # jq and sqlite3 for the tapes; Apache and PHP-FPM for hte.tape.
      - name: Install the tools the tapes call
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q jq sqlite3 apache2-bin php-fpm

      # hte.tape runs gash hte install on ports 80 and 443. The runner is
      # thrown away afterwards, so the system web servers are stopped and
      # their stock vhosts removed rather than migrated.
      - name: Free ports 80 and 443
        run: |
          for svc in apache2 nginx; do
            sudo systemctl disable --now "$svc" 2>/dev/null || true
          done
          sudo rm -f /etc/apache2/sites-enabled/* /etc/nginx/sites-enabled/*

      # Installs vhs, ttyd, ffmpeg and the fonts; no tape is given here.
      - uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1

      - name: Record the tapes
        env:
          GASH_DEMO_HTE: "1"
        run: docs/tapes/render.sh

      - name: Upload the GIFs
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-gifs
          path: docs/assets/*.gif

      - name: Commit changed GIFs
        if: github.event_name != 'pull_request'
        run: |
          git add docs/assets/*.gif
          if git diff --cached --quiet; then
            echo "GIFs unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "docs: re-record demo GIFs [skip ci]"
          git push
