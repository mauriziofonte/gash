<VirtualHost 127.0.0.1:80 [::1]:80>
    # Managed by gash hte. Edit the site with `gash hte site modify`, or add directives to the overlay named below.
    ServerName plain.test
    DocumentRoot "/home/me/src/plain.test/public"
    ServerAdmin admin@localhost.net
    UseCanonicalName Off
    Options -ExecCGI -Includes
    RemoveHandler cgi-script .cgi .pl .plx .ppl .perl
    ErrorLog "/home/me/.local/state/gash/hte/logs/plain.test/error.log"
    CustomLog "/home/me/.local/state/gash/hte/logs/plain.test/access.log" combined
    CustomLog "/home/me/.local/state/gash/hte/logs/plain.test/bytes.log" "%{%s}t %I .\n%{%s}t %O ."

    Protocols h2c http/1.1

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/user/1000/gash-hte/8.3-b188b9bf8d.sock|fcgi://localhost/"
    </FilesMatch>
    # mod_proxy_fcgi sends SCRIPT_FILENAME percent-encoded: PHP-FPM gets the path Apache resolved.
    ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "%{unescape:%{reqenv:SCRIPT_FILENAME}}"

    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml text/css text/javascript application/x-javascript application/javascript application/json application/x-font-ttf application/vnd.ms-fontobject image/x-icon
    </IfModule>

    <Directory "/home/me/src/plain.test/public/">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Site overlay: "/home/me/.config/gash/hte/sites/plain.test.apache.conf", copied into this generation (run `gash hte service reload` after editing it).
    IncludeOptional "/home/me/.local/state/gash/hte/render/gen-7/overlays/sites/plain.test.apache.conf"
</VirtualHost>
