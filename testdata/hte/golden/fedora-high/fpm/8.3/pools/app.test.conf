[app.test]
; Managed by gash hte. Profile: staging
listen = "/run/user/1001/gash-hte/8.3-d8831c8698.sock"
listen.mode = 0660
security.limit_extensions = .php

; Security: Disabled functions
php_admin_value[disable_functions] = apache_child_terminate,apache_get_modules,apache_getenv,apache_note,apache_setenv,dl,highlight_file,show_source,phpinfo

; Security: URL handling
php_admin_flag[allow_url_fopen] = off

; Process manager
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
chdir = /

; Logging
catch_workers_output = yes
request_terminate_timeout = 180s
slowlog = "/home/dev/.local/state/gash/hte/logs/app.test/php-slow.log"
php_flag[display_errors] = off
php_admin_value[error_log] = "/home/dev/.local/state/gash/hte/logs/app.test/php-error.log"
php_admin_flag[log_errors] = on

; Resource limits
php_admin_value[post_max_size] = 128M
php_admin_value[upload_max_filesize] = 128M
php_admin_value[memory_limit] = 1024M
php_value[memory_limit] = 1024M

; PHP settings
php_value[short_open_tag] = On
php_admin_value[open_basedir] = "/home/dev/app/public:/var/lib/php:/usr/lib/php:/usr/share/php:/tmp:/dev/urandom:/home/dev/.local/state/gash/hte/php/8.3/sessions"
php_admin_flag[allow_url_include] = off
php_admin_flag[session.cookie_httponly] = on
php_admin_flag[session.use_strict_mode] = on
php_admin_flag[session.use_only_cookies] = on

; Sessions: the platform's session.save_path is not writable by the user
php_admin_value[session.save_path] = "/home/dev/.local/state/gash/hte/php/8.3/sessions"
