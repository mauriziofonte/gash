[lab.test]
; Managed by gash hte. Profile: hardened
listen = "/run/user/1001/gash-hte/8.3-0897e51e0e.sock"
listen.mode = 0660
security.limit_extensions = .php

; Security: Disabled functions
php_admin_value[disable_functions] = apache_child_terminate,apache_get_modules,apache_getenv,apache_note,apache_setenv,dl,highlight_file,show_source,phpinfo,exec,shell_exec,system,passthru,popen,proc_open,proc_close,proc_get_status,proc_terminate,pcntl_exec,pcntl_fork,pcntl_signal,symlink

; Security: URL handling
php_admin_flag[allow_url_fopen] = off

; Process manager
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
chdir = /

; Logging
catch_workers_output = yes
request_terminate_timeout = 180s
slowlog = "/home/dev/.local/state/gash/hte/logs/lab.test/php-slow.log"
php_flag[display_errors] = off
php_admin_value[error_log] = "/home/dev/.local/state/gash/hte/logs/lab.test/php-error.log"
php_admin_flag[log_errors] = on

; Resource limits
php_admin_value[post_max_size] = 32M
php_admin_value[upload_max_filesize] = 32M
php_admin_value[memory_limit] = 256M
php_value[memory_limit] = 256M

; PHP settings
php_value[short_open_tag] = On
php_admin_value[open_basedir] = "/home/dev/lab:/var/lib/php:/usr/lib/php:/usr/share/php:/tmp:/dev/urandom:/home/dev/.local/state/gash/hte/php/8.3/sessions"
php_admin_flag[allow_url_include] = off
php_admin_flag[session.cookie_httponly] = on
php_admin_flag[session.use_strict_mode] = on
php_admin_flag[session.use_only_cookies] = on
php_admin_value[auto_prepend_file] = ""
php_admin_value[auto_append_file] = ""
php_admin_flag[expose_php] = off
php_admin_value[max_execution_time] = 30
php_admin_value[max_input_time] = 60

; Sessions: the platform's session.save_path is not writable by the user
php_admin_value[session.save_path] = "/home/dev/.local/state/gash/hte/php/8.3/sessions"
