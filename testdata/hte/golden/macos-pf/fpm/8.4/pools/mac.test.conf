[mac.test]
; Managed by gash hte. Profile: dev
listen = "/tmp/gash-hte-501/8.4-6edefd745e.sock"
listen.mode = 0660
security.limit_extensions = .php

; Security: Disabled functions
php_admin_value[disable_functions] = apache_child_terminate,apache_get_modules,apache_getenv,apache_note,apache_setenv

; Security: URL handling
php_admin_flag[allow_url_fopen] = off

; Process manager
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
chdir = /

; Logging
catch_workers_output = yes
request_terminate_timeout = 180s
slowlog = "/Users/me/.local/state/gash/hte/logs/mac.test/php-slow.log"
php_flag[display_errors] = off
php_admin_value[error_log] = "/Users/me/.local/state/gash/hte/logs/mac.test/php-error.log"
php_admin_flag[log_errors] = on

; Resource limits
php_admin_value[post_max_size] = 128M
php_admin_value[upload_max_filesize] = 128M
php_admin_value[memory_limit] = 1024M
php_value[memory_limit] = 1024M

; PHP settings
php_value[short_open_tag] = On
