<VirtualHost 127.0.0.1:80>
    # Auto-generated by the test environment creator on 2026-04-24 10:11:12
    ServerName nocert.test
    ServerAlias www.nocert.test
    DocumentRoot /home/dev/sites/nocert/public
    ServerAdmin admin@localhost.net
    UseCanonicalName Off
    Options -ExecCGI -Includes
    RemoveHandler cgi-script .cgi .pl .plx .ppl .perl
    CustomLog ${APACHE_LOG_DIR}/nocert.test combined
    CustomLog ${APACHE_LOG_DIR}/nocert.test-bytes_log "%{%s}t %I .\n%{%s}t %O ."

    # Enable HTTP2
    Protocols h2 http/1.1

    <FilesMatch \.php$>
        # Apache 2.4.10+ can proxy to unix socket
        SetHandler "proxy:unix:/var/run/php/php8.3-fpm-nocert.test.sock|fcgi://localhost/"
    </FilesMatch>

    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml text/css text/javascript application/x-javascript application/javascript application/json application/x-font-ttf application/vnd.ms-fontobject image/x-icon
    </IfModule>

    <Directory /home/dev/sites/nocert/public/>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        order allow,deny
        allow from all
        Require all granted
    </Directory>

    
</VirtualHost>

