[http.test]
user = dev
group = dev
listen = /var/run/php/php8.3-fpm-http.test.sock
listen.owner = dev
listen.group = dev
listen.mode = 0660
php_admin_value[disable_functions] = apache_child_terminate,apache_get_modules,apache_getenv,apache_note,apache_setenv
php_admin_flag[allow_url_fopen] = off
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
chdir = /

catch_workers_output = yes
request_terminate_timeout = 180s
slowlog = /home/dev/sites/http/public/php8.3-fpm-slow.log
php_flag[display_errors] = off
php_admin_value[error_log] = /home/dev/sites/http/public/php8.3-fpm-errors.log
php_admin_flag[log_errors] = on
php_admin_value[post_max_size] = 128M
php_admin_value[upload_max_filesize] = 128M
php_admin_value[memory_limit] = 1024M
php_value[memory_limit] = 1024M
php_value[short_open_tag] =  On
