<VirtualHost 127.0.0.1:8080>
    # Managed by gash hte. Edit the site with `gash hte site modify`, or add directives to the overlay below.
    ServerName app.test
    ServerAlias www.app.test
    DocumentRoot "/home/dev/app/public"
    ServerAdmin admin@localhost.net
    UseCanonicalName Off
    Options -ExecCGI -Includes
    RemoveHandler cgi-script .cgi .pl .plx .ppl .perl
    ErrorLog "/home/dev/.local/state/gash/hte/logs/app.test/error.log"
    CustomLog "/home/dev/.local/state/gash/hte/logs/app.test/access.log" combined
    CustomLog "/home/dev/.local/state/gash/hte/logs/app.test/bytes.log" "%{%s}t %I .\n%{%s}t %O ."

    Protocols h2c http/1.1

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/user/1001/gash-hte/8.3-d8831c8698.sock|fcgi://localhost/"
    </FilesMatch>
    # mod_proxy_fcgi sends SCRIPT_FILENAME percent-encoded: PHP-FPM gets the path Apache resolved.
    ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "%{unescape:%{reqenv:SCRIPT_FILENAME}}"

    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml text/css text/javascript application/x-javascript application/javascript application/json application/x-font-ttf application/vnd.ms-fontobject image/x-icon
    </IfModule>

    <Directory "/home/dev/app/public/">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Force HTTPS: every plain-HTTP request is redirected (force_https = true).
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^/(.*) https://%{SERVER_NAME}:8443%{REQUEST_URI} [R=307,L]

    IncludeOptional "/home/dev/.config/gash/hte/sites/app.test.apache.conf"
</VirtualHost>

<VirtualHost 127.0.0.1:8443>
    # Managed by gash hte. Edit the site with `gash hte site modify`, or add directives to the overlay below.
    ServerName app.test
    ServerAlias www.app.test
    DocumentRoot "/home/dev/app/public"
    ServerAdmin admin@localhost.net
    UseCanonicalName Off
    Options -ExecCGI -Includes
    RemoveHandler cgi-script .cgi .pl .plx .ppl .perl
    ErrorLog "/home/dev/.local/state/gash/hte/logs/app.test/error.log"
    CustomLog "/home/dev/.local/state/gash/hte/logs/app.test/ssl-access.log" combined
    CustomLog "/home/dev/.local/state/gash/hte/logs/app.test/ssl-bytes.log" "%t %h %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%r\" %b"

    Protocols h2 http/1.1

    <FilesMatch "\.(cgi|shtml|phtml|php)$">
        SSLOptions +StdEnvVars
    </FilesMatch>

    <Directory "/home/dev/app/public/">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml text/css text/javascript application/x-javascript application/javascript application/json application/x-font-ttf application/vnd.ms-fontobject image/x-icon
    </IfModule>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/user/1001/gash-hte/8.3-d8831c8698.sock|fcgi://localhost/"
    </FilesMatch>
    # mod_proxy_fcgi sends SCRIPT_FILENAME percent-encoded: PHP-FPM gets the path Apache resolved.
    ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "%{unescape:%{reqenv:SCRIPT_FILENAME}}"

    SSLEngine on
    SSLCertificateFile "/home/dev/.local/share/gash/hte/certs/app.test/cert.pem"
    SSLCertificateKeyFile "/home/dev/.local/share/gash/hte/certs/app.test/key.pem"

    IncludeOptional "/home/dev/.config/gash/hte/sites/app.test.apache.conf"
</VirtualHost>
