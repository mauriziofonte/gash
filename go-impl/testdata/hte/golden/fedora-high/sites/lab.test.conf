<VirtualHost 127.0.0.1:8080>
    # Managed by gash hte. Edit the site with `gash hte site modify`, or add directives to the overlay below.
    ServerName lab.test
    DocumentRoot "/home/dev/lab"
    ServerAdmin admin@localhost.net
    UseCanonicalName Off
    Options -ExecCGI -Includes
    RemoveHandler cgi-script .cgi .pl .plx .ppl .perl
    ErrorLog "/home/dev/.local/state/gash/hte/logs/lab.test/error.log"
    CustomLog "/home/dev/.local/state/gash/hte/logs/lab.test/access.log" combined
    CustomLog "/home/dev/.local/state/gash/hte/logs/lab.test/bytes.log" "%{%s}t %I .\n%{%s}t %O ."

    Protocols h2c http/1.1

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/user/1001/gash-hte/8.3-0897e51e0e.sock|fcgi://localhost/"
    </FilesMatch>

    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml text/css text/javascript application/x-javascript application/javascript application/json application/x-font-ttf application/vnd.ms-fontobject image/x-icon
    </IfModule>

    <Directory "/home/dev/lab/">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    IncludeOptional "/home/dev/.config/gash/hte/sites/lab.test.apache.conf"
</VirtualHost>

<VirtualHost 127.0.0.1:8443>
    # Managed by gash hte. Edit the site with `gash hte site modify`, or add directives to the overlay below.
    ServerName lab.test
    DocumentRoot "/home/dev/lab"
    ServerAdmin admin@localhost.net
    UseCanonicalName Off
    Options -ExecCGI -Includes
    RemoveHandler cgi-script .cgi .pl .plx .ppl .perl
    ErrorLog "/home/dev/.local/state/gash/hte/logs/lab.test/error.log"
    CustomLog "/home/dev/.local/state/gash/hte/logs/lab.test/ssl-access.log" combined
    CustomLog "/home/dev/.local/state/gash/hte/logs/lab.test/ssl-bytes.log" "%t %h %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%r\" %b"

    Protocols h2 http/1.1

    <FilesMatch "\.(cgi|shtml|phtml|php)$">
        SSLOptions +StdEnvVars
    </FilesMatch>

    <Directory "/home/dev/lab/">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml text/css text/javascript application/x-javascript application/javascript application/json application/x-font-ttf application/vnd.ms-fontobject image/x-icon
    </IfModule>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/user/1001/gash-hte/8.3-0897e51e0e.sock|fcgi://localhost/"
    </FilesMatch>

    SSLEngine on
    SSLCertificateFile "/home/dev/.local/share/gash/hte/certs/lab.test/cert.pem"
    SSLCertificateKeyFile "/home/dev/.local/share/gash/hte/certs/lab.test/key.pem"

    IncludeOptional "/home/dev/.config/gash/hte/sites/lab.test.apache.conf"
</VirtualHost>
