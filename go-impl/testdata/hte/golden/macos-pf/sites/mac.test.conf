<VirtualHost 127.0.0.1:8080 [::1]:8080>
    # Managed by gash hte. Edit the site with `gash hte site modify`, or add directives to the overlay below.
    ServerName mac.test
    ServerAlias www.mac.test
    DocumentRoot "/Users/me/Sites/mac"
    ServerAdmin admin@localhost.net
    UseCanonicalName Off
    Options -ExecCGI -Includes
    RemoveHandler cgi-script .cgi .pl .plx .ppl .perl
    ErrorLog "/Users/me/.local/state/gash/hte/logs/mac.test/error.log"
    CustomLog "/Users/me/.local/state/gash/hte/logs/mac.test/access.log" combined
    CustomLog "/Users/me/.local/state/gash/hte/logs/mac.test/bytes.log" "%{%s}t %I .\n%{%s}t %O ."

    Protocols h2c http/1.1

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/tmp/gash-hte-501/8.4-6edefd745e.sock|fcgi://localhost/"
    </FilesMatch>
    # mod_proxy_fcgi sends SCRIPT_FILENAME percent-encoded: PHP-FPM gets the path Apache resolved.
    ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "%{unescape:%{reqenv:SCRIPT_FILENAME}}"

    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml text/css text/javascript application/x-javascript application/javascript application/json application/x-font-ttf application/vnd.ms-fontobject image/x-icon
    </IfModule>

    <Directory "/Users/me/Sites/mac/">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Force HTTPS: every plain-HTTP request is redirected (force_https = true).
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^/(.*) https://%{HTTP_HOST}%{REQUEST_URI} [R=307,L]

    IncludeOptional "/Users/me/.config/gash/hte/sites/mac.test.apache.conf"
</VirtualHost>

<VirtualHost 127.0.0.1:8443 [::1]:8443>
    # Managed by gash hte. Edit the site with `gash hte site modify`, or add directives to the overlay below.
    ServerName mac.test
    ServerAlias www.mac.test
    DocumentRoot "/Users/me/Sites/mac"
    ServerAdmin admin@localhost.net
    UseCanonicalName Off
    Options -ExecCGI -Includes
    RemoveHandler cgi-script .cgi .pl .plx .ppl .perl
    ErrorLog "/Users/me/.local/state/gash/hte/logs/mac.test/error.log"
    CustomLog "/Users/me/.local/state/gash/hte/logs/mac.test/ssl-access.log" combined
    CustomLog "/Users/me/.local/state/gash/hte/logs/mac.test/ssl-bytes.log" "%t %h %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%r\" %b"

    Protocols h2 http/1.1

    <FilesMatch "\.(cgi|shtml|phtml|php)$">
        SSLOptions +StdEnvVars
    </FilesMatch>

    <Directory "/Users/me/Sites/mac/">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml text/css text/javascript application/x-javascript application/javascript application/json application/x-font-ttf application/vnd.ms-fontobject image/x-icon
    </IfModule>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/tmp/gash-hte-501/8.4-6edefd745e.sock|fcgi://localhost/"
    </FilesMatch>
    # mod_proxy_fcgi sends SCRIPT_FILENAME percent-encoded: PHP-FPM gets the path Apache resolved.
    ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "%{unescape:%{reqenv:SCRIPT_FILENAME}}"

    SSLEngine on
    SSLCertificateFile "/Users/me/.local/share/gash/hte/certs/mac.test/cert.pem"
    SSLCertificateKeyFile "/Users/me/.local/share/gash/hte/certs/mac.test/key.pem"

    IncludeOptional "/Users/me/.config/gash/hte/sites/mac.test.apache.conf"
</VirtualHost>
