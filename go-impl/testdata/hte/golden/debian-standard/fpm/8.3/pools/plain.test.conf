[plain.test]
; Managed by gash hte. Profile: dev
listen = "/run/user/1000/gash-hte/8.3-b188b9bf8d.sock"
listen.mode = 0660
security.limit_extensions = .php

; Security: Disabled functions
php_admin_value[disable_functions] = apache_child_terminate,apache_get_modules,apache_getenv,apache_note,apache_setenv

; Security: URL handling
php_admin_flag[allow_url_fopen] = off

; Process manager
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
