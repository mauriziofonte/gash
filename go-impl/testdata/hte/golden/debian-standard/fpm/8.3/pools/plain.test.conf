; Logging
catch_workers_output = yes
request_terminate_timeout = 180s
slowlog = "/home/me/.local/state/gash/hte/logs/plain.test/php-slow.log"
php_flag[display_errors] = off
php_admin_value[error_log] = "/home/me/.local/state/gash/hte/logs/plain.test/php-error.log"
php_admin_flag[log_errors] = on

; Resource limits
php_admin_value[post_max_size] = 128M
php_admin_value[upload_max_filesize] = 128M
php_admin_value[memory_limit] = 1024M
php_value[memory_limit] = 1024M

; PHP settings
php_value[short_open_tag] = On

; Global overlay /home/me/.config/gash/hte/php/8.3.ini
php_admin_value[memory_limit] = 768M
php_admin_flag[opcache.enable] = on
php_admin_value[date.timezone] = "Europe/Rome"
