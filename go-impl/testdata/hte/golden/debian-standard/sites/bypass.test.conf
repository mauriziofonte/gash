    ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "%{unescape:%{reqenv:SCRIPT_FILENAME}}"

    SSLEngine on
    SSLCertificateFile "/home/me/.local/share/gash/hte/certs/bypass.test/cert.pem"
    SSLCertificateKeyFile "/home/me/.local/share/gash/hte/certs/bypass.test/key.pem"

    IncludeOptional "/home/me/.config/gash/hte/sites/bypass.test.apache.conf"
</VirtualHost>
