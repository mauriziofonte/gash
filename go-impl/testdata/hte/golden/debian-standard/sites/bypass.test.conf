<VirtualHost 127.0.0.1:80 [::1]:80>
    # Managed by gash hte. Edit the site with `gash hte site modify`, or add directives to the overlay below.
    ServerName bypass.test
    DocumentRoot "/home/me/src/bypass.test/public"
    ServerAdmin admin@localhost.net
    UseCanonicalName Off
    Options -ExecCGI -Includes
    RemoveHandler cgi-script .cgi .pl .plx .ppl .perl
    ErrorLog "/home/me/.local/state/gash/hte/logs/bypass.test/error.log"
    CustomLog "/home/me/.local/state/gash/hte/logs/bypass.test/access.log" combined
    CustomLog "/home/me/.local/state/gash/hte/logs/bypass.test/bytes.log" "%{%s}t %I .\n%{%s}t %O ."

    Protocols http/1.1

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/user/1000/gash-hte/8.3-16aeaff6b1.sock|fcgi://localhost/"
    </FilesMatch>
    # mod_proxy_fcgi sends SCRIPT_FILENAME percent-encoded: PHP-FPM gets the path Apache resolved.
    ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "%{unescape:%{reqenv:SCRIPT_FILENAME}}"

    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml text/css text/javascript application/x-javascript application/javascript application/json application/x-font-ttf application/vnd.ms-fontobject image/x-icon
    </IfModule>

    <Directory "/home/me/src/bypass.test/public/">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Force HTTPS, except for requests from 127.0.0.1 and ::1 (force_https_bypass_loopback = true).
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteCond %{REMOTE_ADDR} !^127\.0\.0\.1$
    RewriteCond %{REMOTE_ADDR} !^::1$
    RewriteRule ^/(.*) https://%{HTTP_HOST}%{REQUEST_URI} [R=307,L]

    IncludeOptional "/home/me/.config/gash/hte/sites/bypass.test.apache.conf"
</VirtualHost>

<VirtualHost 127.0.0.1:443 [::1]:443>
