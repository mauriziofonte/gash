<VirtualHost 127.0.0.1:80 [::1]:80>
    # Managed by gash hte. Edit the site with `gash hte site modify`, or add directives to the overlay below.
    ServerName forced.test
    ServerAlias www.forced.test api.forced.test
    DocumentRoot "/home/me/src/forced.test/public"
    ServerAdmin admin@localhost.net
    UseCanonicalName Off
    Options -ExecCGI -Includes
    RemoveHandler cgi-script .cgi .pl .plx .ppl .perl
    ErrorLog "/home/me/.local/state/gash/hte/logs/forced.test/error.log"
    CustomLog "/home/me/.local/state/gash/hte/logs/forced.test/access.log" combined
    CustomLog "/home/me/.local/state/gash/hte/logs/forced.test/bytes.log" "%{%s}t %I .\n%{%s}t %O ."

    Protocols h2c http/1.1

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/user/1000/gash-hte/8.4-bc936fbb4e.sock|fcgi://localhost/"
    </FilesMatch>

    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml text/css text/javascript application/x-javascript application/javascript application/json application/x-font-ttf application/vnd.ms-fontobject image/x-icon
    </IfModule>

    <Directory "/home/me/src/forced.test/public/">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Force HTTPS: every plain-HTTP request is redirected (force_https = true).
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^/(.*) https://%{HTTP_HOST}%{REQUEST_URI} [R=307,L]

    IncludeOptional "/home/me/.config/gash/hte/sites/forced.test.apache.conf"
</VirtualHost>

<VirtualHost 127.0.0.1:443 [::1]:443>
    # Managed by gash hte. Edit the site with `gash hte site modify`, or add directives to the overlay below.
    ServerName forced.test
    ServerAlias www.forced.test api.forced.test
    DocumentRoot "/home/me/src/forced.test/public"
    ServerAdmin admin@localhost.net
    UseCanonicalName Off
    Options -ExecCGI -Includes
    RemoveHandler cgi-script .cgi .pl .plx .ppl .perl
    ErrorLog "/home/me/.local/state/gash/hte/logs/forced.test/error.log"
    CustomLog "/home/me/.local/state/gash/hte/logs/forced.test/ssl-access.log" combined
    CustomLog "/home/me/.local/state/gash/hte/logs/forced.test/ssl-bytes.log" "%t %h %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%r\" %b"

    Protocols h2 http/1.1

    <FilesMatch "\.(cgi|shtml|phtml|php)$">
        SSLOptions +StdEnvVars
    </FilesMatch>

    <Directory "/home/me/src/forced.test/public/">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml text/css text/javascript application/x-javascript application/javascript application/json application/x-font-ttf application/vnd.ms-fontobject image/x-icon
    </IfModule>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/user/1000/gash-hte/8.4-bc936fbb4e.sock|fcgi://localhost/"
    </FilesMatch>

    SSLEngine on
    SSLCertificateFile "/home/me/.local/share/gash/hte/certs/forced.test/cert.pem"
    SSLCertificateKeyFile "/home/me/.local/share/gash/hte/certs/forced.test/key.pem"

    IncludeOptional "/home/me/.config/gash/hte/sites/forced.test.apache.conf"
</VirtualHost>
